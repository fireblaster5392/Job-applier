# How often to poll every board, in seconds.
poll_seconds = 60
# Max boards fetched at the same time.
concurrency = 8

[filters]
# A job matches if its title contains any include word (whole word, case-insensitive)
# and no exclude word. Placeholder targets: swap in your real roles.
title_include = ["software engineer", "software developer", "backend", "frontend", "full stack",
                 "fullstack", "machine learning", "ml engineer", "data engineer", "platform engineer",
                 "infrastructure", "swe", "new grad"]
title_exclude = ["manager", "director", "principal", "staff", "head of", "vp", "recruiter", "sales"]
# Substring match against the job location. Empty list = any location.
locations = ["united states", "usa", "new york", "san francisco", "seattle", "remote"]
# Remote jobs match even if their location isn't in the list above.
allow_remote = true

[discovery]
# Job-board search through JobSpy (Indeed, Glassdoor, LinkedIn public job search), on top of the
# company boards below. Runs as the `discover` service. Logged out, no proxies, gentle intervals;
# a site that blocks is backed off for up to 6 hours. Remove "linkedin" from sites if you'd rather
# not touch LinkedIn at all (their terms don't allow automated access, even logged out).
enabled = true
sites = ["indeed", "glassdoor", "linkedin"]
interval_minutes = 30        # per search, per site
hours_old = 24               # only postings from the last day
results_per_site = 25
country_indeed = "usa"       # Indeed/Glassdoor country: usa, canada, uk, ...
searches = [
  {term = "software engineer new grad", location = "United States"},
  {term = "backend engineer", location = "New York, NY"},
  {term = "software engineer", remote = true},
]

[pipeline]
# "auto": every matching job gets a quick fit score; jobs at or above score_threshold are
#         tailored automatically and sent to Telegram once, ready to approve.
# "manual": every matching job is sent to Telegram first, and you tap "Tailor resume".
mode = "auto"
score_threshold = 70
# Quick scoring model: runs on every matching job, so it's the cheap one (~$0.0005 a job).
score_model = "claude-haiku-5-5"
# Also send jobs below the threshold to Telegram (as plain alerts with a Tailor button).
# Either way they're listed on the dashboard under "below_threshold".
notify_below_threshold = false

[tailor]
# Who scores and tailors: "claude" (built in) or "mcp" (your own tailoring server, see
# docs/tailoring-server.md). With "mcp", set mcp_server to its URL or command.
provider = "claude"
# mcp_server = "http://127.0.0.1:9000/mcp"
# Model for resume + cover letter tailoring (about $0.14 a job on Opus 5.5).
# "claude-sonnet-5-5" roughly halves the cost if the quality holds up for you.
model = "claude-opus-5-5"

[apply]
# Approve = submit. The apply queue fills the form, uploads PDFs and submits, one at a time.
# It comes back to you instead of submitting when: the form has a CAPTCHA, a required question
# has no saved answer (legal, salary...), or Claude wrote free-text answers you should check.
max_per_day = 15
min_gap_minutes = 4          # random gap between applications, between these two
max_gap_minutes = 12
active_hours = [8, 22]       # local time
timezone = "America/Edmonton"
dry_run = false              # true: fill forms but never click Submit
# Browser agent for forms the generic filler can't do (Workday, iCIMS, Taleo, SmartRecruiters,
# company portals). Claude drives the browser page by page, stops at the final Submit for your
# review, and submits only after your Submit tap. Roughly $0.30-1.50 per application on Sonnet.
# For sites that need an account, set APPLY_LOGIN_EMAIL / APPLY_LOGIN_PASSWORD in .env.
agent = true
agent_model = "claude-sonnet-5-5"

[outreach]
# After you approve a job, find people there (Brave Search for LinkedIn profiles, Apollo for
# emails), draft a LinkedIn note and an email for each, and send them to you on Telegram.
# Emails go out only when you tap "Send email". LinkedIn notes are for you to paste yourself.
enabled = true
# Job statuses that trigger outreach: after the application is in.
trigger_statuses = ["submitted"]
max_contacts = 3
max_emails_per_day = 10
model = "claude-opus-5-5"

[networking]
# Every day, a small batch of personal notes to founders and recruiters at target companies, even
# with no open role, asking for a 15-minute chat. Same rules: you paste LinkedIn notes yourself,
# emails go out only when you tap Send.
enabled = true
per_day = 5
daily_hour = 9                      # local time
timezone = "America/Edmonton"
cooldown_days = 90                  # don't contact the same company again for this long
followup_days = 5                   # one follow-up per person if they haven't replied (applies to job outreach too)
# companies = ["linear", "ramp"]    # leave out to use every company in [prep]
# Interview prep sheet, drafted when an email says interview (or from the job page). Uses your
# profile, profile/stories/*.md, what you sent, the interview email and a Brave search on the company.
enabled = true
model = "claude-opus-5-5"     # about $0.10-0.20 a sheet
output_dir = "data/prep"

[companies], startups first

[mail]
# Inbox sync reads replies and the companies' application emails (IMAP, read-only).
model = "claude-haiku-5-5"

# Starter list of well-known tech companies. Slugs are the board name in each ATS URL,
# e.g. boards.greenhouse.io/<slug>, jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>.
# A wrong slug just logs "board not found" and is skipped.
[companies]
greenhouse = ["stripe", "airbnb", "databricks", "figma", "discord", "robinhood", "coinbase",
              "cloudflare", "dropbox", "anthropic", "gitlab", "reddit", "pinterest", "lyft",
              "instacart", "brex", "datadog", "mongodb", "twilio", "asana", "duolingo",
              "scaleai", "vercel", "airtable", "samsara"]
lever = ["palantir", "plaid", "spotify", "whoop"]
ashby = ["openai", "notion", "ramp", "linear", "supabase", "replit", "cursor", "deel", "posthog"]
