# Runs on a small always-on VPS: `docker compose up -d`, logs with `docker compose logs -f watcher`.
# Services for later steps are commented out until they're built.
services:
  watcher:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro

  web:        # approval queue + dashboard
    build: .
    restart: unless-stopped
    command: uvicorn --factory web.app:main_app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DB_PATH: /app/data/jobs.db
    volumes:
      - ./data:/app/data
      - ./profile:/app/profile:ro
      - ./config.toml:/app/config.toml:ro
    ports: ["127.0.0.1:8000:8000"]   # reach it over Tailscale, not the public internet

  bot:        # Telegram Tailor / Skip / Approve / Reject buttons
    build: .
    restart: unless-stopped
    command: python -m bot.main --db /app/data/jobs.db
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./profile:/app/profile:ro
      - ./config.toml:/app/config.toml:ro

