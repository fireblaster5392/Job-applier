# Runs on a small always-on VPS: `docker compose up -d`, logs with `docker compose logs -f watcher`.
# Services for later steps are commented out until they're built.
services:
  watcher:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro

  worker:     # scores new matches, tailors the good fits, sends them to Telegram
    build: .
    restart: unless-stopped
    command: python -m worker.main --db /app/data/jobs.db
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./profile:/app/profile:ro
      - ./config.toml:/app/config.toml:ro

  apply:      # submits approved applications at a human pace
    build: {context: ., dockerfile: Dockerfile.apply}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./profile:/app/profile:ro
      - ./config.toml:/app/config.toml:ro

  web:        # approval queue + dashboard
    build: .
    restart: unless-stopped
    command: uvicorn --factory web.app:main_app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DB_PATH: /app/data/jobs.db
    volumes:
      - ./data:/app/data
      - ./profile:/app/profile:ro
      - ./config.toml:/app/config.toml:ro
    ports: ["127.0.0.1:8000:8000"]   # reach it over Tailscale, not the public internet

  bot:        # Telegram Tailor / Skip / Approve / Reject buttons
    build: .
    restart: unless-stopped
    command: python -m bot.main --db /app/data/jobs.db
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./profile:/app/profile:ro
      - ./config.toml:/app/config.toml:ro

  mail:       # inbox sync: replies to your outreach + companies' application emails
    build: .
    restart: unless-stopped
    command: python -m mail.main --db /app/data/jobs.db
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro

  mcp:        # job-search MCP server for Claude Code / Desktop: profile, resume rendering, your pipeline
    build: .
    restart: unless-stopped
    command: python -m profile_mcp.server --http --host 0.0.0.0 --port 8765
    environment:                     # no .env: this server needs no secrets
      DB_PATH: /app/data/jobs.db
      RESUME_OUTPUT_DIR: /app/data/output
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./data:/app/data
      - ./profile:/app/profile:ro
    ports: ["127.0.0.1:8765:8765"]   # publish on your tailnet with `tailscale serve`, see README

