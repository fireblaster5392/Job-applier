<!doctype html>
<html><head><title>Acme Careers - Apply</title>
<style>.hidden{display:none} [role=listbox]{border:1px solid #999}</style></head>
<body>
<h1>Backend Engineer</h1>
<section id="s1"><h2>My Information</h2>
  <label for="fn">First Name*</label><input id="fn" data-automation-id="legalNameSection_firstName" required>
  <div><span id="hearL">How Did You Hear About Us?*</span>
    <button type="button" role="combobox" aria-labelledby="hearL" id="hear">Select One</button>
    <ul role="listbox" id="hearList" class="hidden">
      <li role="option">Company careers page</li><li role="option">Referral</li></ul></div>
  <button type="button" id="next1">Save and Continue</button></section>
<section id="s2" class="hidden"><h2>Application Questions</h2>
  <fieldset><legend>Are you legally authorized to work in the United States?*</legend>
    <label><input type="radio" name="auth" value="yes"> Yes</label>
    <label><input type="radio" name="auth" value="no"> No</label></fieldset>
  <button type="button" id="pick">Select files</button><input type="file" id="resume" class="hidden">
  <span id="fname"></span>
  <button type="button" id="next2">Save and Continue</button></section>
<section id="s3" class="hidden"><h2>Review</h2><div id="summary"></div>
  <button type="button" id="submit">Submit</button></section>
<div id="done" class="hidden">Thank you for applying!</div>
<script>
const $ = id => document.getElementById(id);
const show = id => { for (const s of ['s1','s2','s3','done']) $(s).classList.toggle('hidden', s !== id); };
$('hear').onclick = () => $('hearList').classList.toggle('hidden');
for (const li of document.querySelectorAll('[role=option]')) li.onclick = () => { $('hear').innerText = li.innerText; $('hearList').classList.add('hidden'); };
$('pick').onclick = () => $('resume').click();
$('resume').onchange = () => $('fname').innerText = $('resume').files[0].name;
$('next1').onclick = () => { if ($('fn').value && $('hear').innerText !== 'Select One') show('s2'); };
$('next2').onclick = () => { const a = document.querySelector('input[name=auth]:checked');
  if (a && $('resume').files.length) { $('summary').innerText = $('fn').value + ' / ' + a.value + ' / ' + $('fname').innerText; show('s3'); } };
$('submit').onclick = () => show('done');
</script></body></html>
